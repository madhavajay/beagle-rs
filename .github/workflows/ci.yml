name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Rust gate: format, lints, and the full test suite (incl. the committed
  # cross-language parity fixtures). Does not need the Java submodule.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: parity (e2e byte-for-byte vs golden fixtures)
        # Runs the actual beagle-rs/bref3/unbref3 binaries on fixtures/official/ and asserts
        # byte-identity with the golden Java outputs. Release build (the gt= phasing run is
        # slow in debug). Needs only the committed fixtures, not the Java submodule.
        run: cargo test -p beagle-rs-cli --release --test parity_official -- --ignored

  # Parity gate: rebuild the Java reference from the submodule, regenerate the
  # cross-language fixtures, and fail if the committed fixtures have drifted.
  java-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the beagle submodule over HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build the Java reference
        run: bash scripts/build-java.sh
      - name: Regenerate parity fixtures
        run: bash scripts/gen-parity.sh
      - name: Fail if committed fixtures drifted from the Java reference
        run: git diff --exit-code -- fixtures/

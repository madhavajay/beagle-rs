[package]
name = "beagle-rs-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line front-end for beagle-rs (drop-in replacement for beagle.jar)"

[[bin]]
name = "beagle-rs"
path = "src/main.rs"

[[bin]]
name = "bref3"
path = "src/bin/bref3.rs"

[[bin]]
name = "unbref3"
path = "src/bin/unbref3.rs"

[dependencies]
beagle-rs = { workspace = true }

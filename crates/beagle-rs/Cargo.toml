[package]
name = "beagle-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[lib]
name = "beagle_rs"
path = "src/lib.rs"

[dependencies]
flate2 = { workspace = true }
# Force the vendored static classic zlib so BGZIP deflate output is identical on every
# platform (a system zlib-ng would emit different bytes and break byte-for-byte parity).
libz-sys = { version = "1", default-features = false, features = ["static"] }

[dev-dependencies]
